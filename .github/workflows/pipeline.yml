name: CI/CD Pipeline

on:
  push:
    branches: [team-dev, development, main]
  pull_request:
    branches: [team-dev, development, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/

  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create artifact
        run: zip -r complaint-system.zip . -x ".git/*" ".venv/*"
      - uses: actions/upload-artifact@v4
        with:
          name: complaint-system
          path: complaint-system.zip

  deploy-staging:
    needs: package
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to STAGING"
      - run: echo "Running integration and smoke tests"

  deploy-production:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deploying to PRODUCTION"
      - run: echo "Smoke test passed"