{% extends "base.html" %}
{% block content %}
<h1>My Complaints</h1>

<form method="get">
  <input type="text" name="q" value="{{ q }}" placeholder="Search by Complaint ID">
  <button type="submit">Search</button>
</form>
<br>

<table border="1" cellpadding="8">
  <tr>
    <th>Complaint ID</th>
    <th>Category</th>
    <th>Status</th>
    <th>Department</th>
    <th>Action</th>
  </tr>
  {% for c in complaints %}
  <tr>
    <td>{{ c.complaint_id }}</td>
    <td>{{ c.category }}</td>
    <td>{{ c.status }}</td>
    <td>{{ c.department }}</td>
    <td><a href="{{ url_for('tracking.complaint_details', complaint_id=c.complaint_id) }}">View</a></td>
  </tr>
  {% else %}
  <tr><td colspan="5">No complaints found.</td></tr>
  {% endfor %}
</table>
{% endblock %}
