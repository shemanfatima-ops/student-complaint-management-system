<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Complaint</title>
</head>
<body>
    <div style="max-width: 500px; margin: 50px auto; font-family: Arial, sans-serif;">
        <h2>Submit Student Complaint</h2>
        <form method="POST">
            <label for="category">Category:</label><br>
            <select name="category" id="category" required style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px;">
                <option value="">--Select Category--</option>
                <option value="Academics">Academics</option>
                <option value="Fees">Fees</option>
                <option value="Facilities">Facilities</option>
                <option value="Harassment">Harassment</option>
                <option value="IT">IT</option>
            </select><br>

            <label for="description">Description:</label><br>
            <textarea name="description" id="description" rows="5" required placeholder="Describe your issue..." style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px;"></textarea><br>

            <button type="submit" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer;">Submit Complaint</button>
        </form>
    </div>
</body>
</html>
